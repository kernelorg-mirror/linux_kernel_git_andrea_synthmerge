[package]
name = "synthmerge"
version = "0.3.8"
edition = "2024"
description = "AI-powered git mergetool that resolves conflicts using LLMs"
readme = "README.md"
repository = "https://gitlab.com/aarcange/synthmerge"
license = "GPL-3.0-or-later OR AGPL-3.0-or-later"
keywords = ["ai", "git", "mergetool", "conflict-resolution", "llm"]
default-run = "synthmerge"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.0"
anyhow = "1.0"
serde_json = "1.0"
similar = "3.1"
shellexpand = "3.1"
futures = "0.3"
env_logger = "0.11"
log = "0.4"
csv = "1.4"
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0"
sha2 = "0.10"
lmdb = "0.8"
zstd = "0.13"
memchr = "2.8"
textdistance = "1.1"
tempfile = "3.23"

[build-dependencies]
clap_mangen = "0.2"
clap = { version = "4.5", features = ["derive"] }

[features]
default = ["telemetry"]
telemetry = []
